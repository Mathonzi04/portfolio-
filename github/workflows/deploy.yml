name: Deploy to GitHub Pages

on:
  push:
    paths:
      - 'coffee-shop-landing-page.zip'  # Only runs when you upload this zip

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip site
        run: unzip -o coffee-shop-landing-page.zip -d out

      - name: Flatten folder if needed
        run: |
          shopt -s dotglob
          mv out/*/* out/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'out'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
